[package]
name = "imgui_kit"
version = "0.1.0"
edition = "2024"

[dependencies]
imgui = { version = "0.12", features = ["tables-api"] }

# Only for `cargo run --example launch`; the library itself stays backend-free.
[dev-dependencies]
imgui-winit-support = "0.12"
imgui-glow-renderer = "0.12"
glow = "0.13"
glutin = "0.31"
glutin-winit = "0.4"
raw-window-handle = "0.5"
winit = { version = "0.29", features = ["rwh_05"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
# timeBeginPeriod(1): WaitUntil wakes every 1 ms instead of 15.6 ms, so the
# render-on-demand loop reaches 60 fps while something animates.
windows-sys = { version = "0.48", features = ["Win32_Media"] }

[[example]]
name = "launch"
